{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>🤖 Assistant IA</h2>
  <div id="chat-box" style="height:300px; overflow-y:auto; border:1px solid #ddd; padding:10px; border-radius:8px;"></div>
  <form id="chat-form" class="mt-3">
    <input type="text" id="user-message" class="form-control" placeholder="Posez votre question...">
    <button type="submit" class="btn btn-primary mt-2">Envoyer</button>
  </form>
</div>

<script>
document.querySelector("#chat-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = document.querySelector("#user-message").value;
  const chatBox = document.querySelector("#chat-box");
  chatBox.innerHTML += `<p><b>👤 Vous:</b> ${message}</p>`;
  document.querySelector("#user-message").value = "";

  const response = await fetch("{% url 'gestion_vehicules:api_chat_with_ai' %}", {
    method: "POST",
    headers: {
        "X-CSRFToken": "{{ csrf_token }}",
        "Content-Type": "application/json"
    },
    body: JSON.stringify({ message })
});

  const data = await response.json();
  chatBox.innerHTML += `<p><b>🤖 IA:</b> ${data.response}</p>`;
  chatBox.scrollTop = chatBox.scrollHeight;
});
</script>
{% endblock %}
